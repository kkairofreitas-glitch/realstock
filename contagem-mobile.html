/* =========================================================
   SPLASH REALSTOCK - ABERTURA DO PWA
   ========================================================= */

   #splashScreen {
  position: fixed;
  inset: 0;
  z-index: 99999;

  display: none;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 50% 42%,
      #12395c 0%,
      #071f3a 48%,
      #031326 100%
    );

  overflow: hidden;

  opacity: 1;
  visibility: visible;

  transition:
    opacity 0.4s ease,
    visibility 0.4s ease;
}

/*
  Só mostramos a splash quando o JS
  confirmar que é uma abertura do PWA.
*/
#splashScreen.splash-ativa {
  display: flex;
}

.splash-realstock-content {
  position: relative;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  width: min(82vw, 330px);

  text-align: center;

  animation:
    splashConteudoEntrada 0.65s
    cubic-bezier(.2,.8,.2,1)
    both;
}

/* Halo externo */
.splash-logo-wrap {
  position: relative;

  width: 190px;
  height: 190px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 22px;
}

/* Círculo luminoso atrás da logo */
.splash-logo-wrap::before {
  content: "";

  position: absolute;
  inset: -13px;

  border-radius: 50%;

  border: 2px solid
    rgba(0, 215, 220, 0.22);

  box-shadow:
    0 0 22px rgba(0, 210, 220, 0.18),
    inset 0 0 22px rgba(0, 210, 220, 0.08);

  animation:
    splashPulso 1.5s ease-in-out infinite;
}

/* Arco giratório em torno da logo */
.splash-logo-wrap::after {
  content: "";

  position: absolute;
  inset: -13px;

  border-radius: 50%;

  border:
    3px solid transparent;

  border-top-color:
    #12d4d8;

  border-right-color:
    rgba(18, 212, 216, 0.24);

  animation:
    splashArco 1.15s linear infinite;
}

/* Logo */
#splashScreen img {
  position: relative;
  z-index: 2;

  width: 168px;
  height: 168px;

  display: block;

  object-fit: cover;

  border-radius: 34px;

  box-shadow:
    0 22px 60px
      rgba(0, 0, 0, 0.42),
    0 0 28px
      rgba(0, 201, 207, 0.14);

  animation:
    splashLogoEntrada 0.75s
    cubic-bezier(.16,1,.3,1)
    both;
}

/*
  Brilho que atravessa a logo.
*/
.splash-logo-brilho {
  position: absolute;

  z-index: 3;

  width: 165px;
  height: 165px;

  overflow: hidden;

  border-radius: 34px;

  pointer-events: none;
}

.splash-logo-brilho::after {
  content: "";

  position: absolute;

  top: -35%;
  left: -80%;

  width: 45%;
  height: 170%;

  transform:
    rotate(20deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,0.30),
      transparent
    );

  animation:
    splashBrilho 1.25s
    0.35s ease-in-out forwards;
}

/* Nome */
#splashScreen h1 {
  margin: 0;

  color: #ffffff;

  font-size: 2rem;
  line-height: 1;

  font-weight: 900;

  letter-spacing: -0.04em;

  text-shadow:
    0 5px 18px
      rgba(0,0,0,0.32);

  animation:
    splashTextoEntrada
    0.55s 0.28s ease both;
}

#splashScreen h1 span {
  color: #10cbd0;
}

/* Subtítulo */
#splashScreen p {
  margin:
    9px 0 0;

  color:
    rgba(255,255,255,0.73);

  font-size: 0.78rem;

  font-weight: 800;

  letter-spacing: 0.18em;

  text-transform: uppercase;

  animation:
    splashTextoEntrada
    0.55s 0.42s ease both;
}

/* Pequena barra inferior */
.splash-progress {
  position: relative;

  width: 110px;
  height: 3px;

  margin-top: 24px;

  overflow: hidden;

  border-radius: 999px;

  background:
    rgba(255,255,255,0.14);
}

.splash-progress::after {
  content: "";

  position: absolute;
  inset: 0;

  transform:
    translateX(-100%);

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      #079ba8,
      #10d9da,
      #ffffff
    );

  animation:
    splashProgresso 1.25s
    0.25s ease-out forwards;
}

/* Saída */
#splashScreen.splash-hide {
  opacity: 0;
  visibility: hidden;
}

/* ================= ANIMAÇÕES ================= */

@keyframes splashConteudoEntrada {
  from {
    opacity: 0;
    transform:
      translateY(14px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }
}

@keyframes splashLogoEntrada {
  0% {
    opacity: 0;
    transform:
      scale(0.72);
  }

  65% {
    opacity: 1;
    transform:
      scale(1.04);
  }

  100% {
    opacity: 1;
    transform:
      scale(1);
  }
}

@keyframes splashTextoEntrada {
  from {
    opacity: 0;
    transform:
      translateY(8px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }
}

@keyframes splashArco {
  to {
    transform:
      rotate(360deg);
  }
}

@keyframes splashPulso {
  0%,
  100% {
    transform:
      scale(0.98);

    opacity: 0.55;
  }

  50% {
    transform:
      scale(1.035);

    opacity: 1;
  }
}

@keyframes splashBrilho {
  from {
    left: -80%;
  }

  to {
    left: 145%;
  }
}

@keyframes splashProgresso {
  from {
    transform:
      translateX(-100%);
  }

  to {
    transform:
      translateX(0);
  }
}

/*
  Acessibilidade:
  se o aparelho pedir redução de movimento,
  não fazemos animações exageradas.
*/
@media (
  prefers-reduced-motion: reduce
) {
  .splash-realstock-content,
  #splashScreen img,
  #splashScreen h1,
  #splashScreen p,
  .splash-logo-wrap::before,
  .splash-logo-wrap::after,
  .splash-logo-brilho::after,
  .splash-progress::after {
    animation: none !important;
  }
}
.toast-mobile {
  position: fixed;
  top: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a3a52;

  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.toast-mobile.show {
  opacity: 1;
}

<script>
  (function () {
    const splash =
      document.getElementById('splashScreen');
  
    if (!splash) return;
  
    const params =
      new URLSearchParams(
        window.location.search
      );
  
    const forcarSplash =
      params.get('splash') === '1';
  
    const estaEmPwa =
      window.matchMedia(
        '(display-mode: standalone)'
      ).matches ||
      window.navigator.standalone === true;
  
    /*
      Durante o teste com ?splash=1,
      mostra sempre.
  
      Fora do teste, mostra somente
      quando aberto como PWA.
    */
    if (
      !forcarSplash &&
      !estaEmPwa
    ) {
      splash.remove();
      return;
    }
  
    splash.classList.add(
      'splash-ativa'
    );
  
    splash.setAttribute(
      'aria-hidden',
      'false'
    );
  
    /*
      Força a animação a começar
      depois que a splash já estiver visível.
    */
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        splash.classList.add(
          'splash-iniciada'
        );
      });
    });
  
    setTimeout(() => {
      splash.classList.add(
        'splash-hide'
      );
  
      setTimeout(() => {
        splash.remove();
      }, 450);
  
    }, 2200);
  })();
  </script>

let toqueInicialY = 0;

document.addEventListener(

  (e) => {
    toqueInicialY = e.touches[0].clientY;
  },
  { passive: true }
);

document.addEventListener(
  'touchmove',
  (e) => {
    const toqueAtualY = e.touches[0].clientY;
    const puxandoParaBaixo = toqueAtualY > toqueInicialY;
    const noTopo = window.scrollY <= 0;

    if (noTopo && puxandoParaBaixo) {
      e.preventDefault();
    }
  },
  { passive: false }
);

function tocarBipLeitura() {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    const audioCtx = new AudioContextClass();

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.type = 'square';

    // MAIS AGUDO
    oscillator.frequency.setValueAtTime(2200, audioCtx.currentTime);

    // MAIS ALTO
    gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(
      0.9,
      audioCtx.currentTime + 0.02
    );

    // Mantém o som por mais tempo
    gainNode.gain.exponentialRampToValueAtTime(
      0.0001,
      audioCtx.currentTime + 0.45
    );

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.45);

    // Vibração forte
    if (navigator.vibrate) {
      navigator.vibrate([120, 40, 120]);
    }
  } catch (e) {
    console.log('Erro ao tocar bip:', e);
  }
}

function salvarFiltroLocal(dados) {
  const itens = Array.isArray(dados.itens) ? dados.itens : [];
  const enderecos = Array.isArray(dados.enderecos) ? dados.enderecos : [];

  localStorage.setItem('filtroAppInventario', JSON.stringify(itens));
  localStorage.setItem('filtroAppEnderecos', JSON.stringify(enderecos));

  localStorage.setItem('filtroAppInventarioMeta', JSON.stringify({
    atualizadoEm: dados.atualizadoEm || null,
    total: dados.total || itens.length,
    totalEnderecos: dados.totalEnderecos || enderecos.length
  }));
}

function carregarFiltroLocal() {
  try {
    filtroApp = JSON.parse(localStorage.getItem('filtroAppInventario') || '[]');
    enderecosFiltroApp = JSON.parse(localStorage.getItem('filtroAppEnderecos') || '[]');

    const meta = JSON.parse(localStorage.getItem('filtroAppInventarioMeta') || '{}');

    if (Array.isArray(filtroApp) && filtroApp.length) {
      statusFiltro.textContent =
        `Filtro carregado: ${meta.total || filtroApp.length} itens | ${meta.totalEnderecos || enderecosFiltroApp.length} endereços`;
    } else {
      statusFiltro.textContent = 'Nenhum filtro baixado.';
    }
  } catch {
    filtroApp = [];
    enderecosFiltroApp = [];
    statusFiltro.textContent = 'Erro ao ler filtro local.';
  }
}
function validarEnderecoLocal(valor) {
  const enderecoDigitado = String(valor || '').trim();
  const numeroDigitado = Number(enderecoDigitado);

  if (!enderecoDigitado) return false;

  if (!Array.isArray(enderecosFiltroApp) || !enderecosFiltroApp.length) {
    return false;
  }

  return enderecosFiltroApp.some((endereco) => {
    if (typeof endereco === 'string' || typeof endereco === 'number') {
      return String(endereco).trim() === enderecoDigitado;
    }

    const enderecoNumero = String(
      endereco.enderecoNumero ||
      endereco.numero ||
      endereco.endereco ||
      endereco.codigo ||
      ''
    ).trim();

    if (enderecoNumero && enderecoNumero === enderecoDigitado) {
      return true;
    }

    const inicio = Number(endereco.inicio) || 0;
    const fim = Number(endereco.fim) || 0;

    if (
      Number.isFinite(numeroDigitado) &&
      inicio > 0 &&
      fim >= inicio &&
      numeroDigitado >= inicio &&
      numeroDigitado <= fim
    ) {
      return true;
    }

    return false;
  });
}
  async function baixarFiltro() {
    if (modoOperacaoAtual === 'sem-base') {
      statusFiltro.textContent = 'Modo sem base ativo: filtro desabilitado.';
      return;
    }

    try {
      mensagem.textContent = 'Baixando filtro...';
      mensagem.className = 'mensagem info';

      const res = await fetch('/filtro-app');
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.erro || 'Erro ao baixar filtro.');
      }

  const combinacaoValida =

  else if (

  ) {
    textoErro =

  else if (

  else if (

  ) {

function somenteDigitosCodigo(valor) {
  return String(valor || "")
    .replace(/\D/g, "")
    .trim();
}


function codigoProdutoValido(valor) {
  const codigo =
    somenteDigitosCodigo(valor);

  const tamanhoValido =
    codigo.length === 8 ||
    codigo.length === 12 ||
    codigo.length === 13 ||
    codigo.length === 14;

  if (!tamanhoValido) {
    return false;
  }

  return validarDigitoVerificadorGtin(
    codigo
  );
}
function validarDigitoVerificadorGtin(valor) {
  const codigo =
    somenteDigitosCodigo(valor);

  if (
    ![
      8,
      12,
      13,
      14
    ].includes(codigo.length)
  ) {
    return false;
  }

  const digitos =
    codigo
      .split('')
      .map(Number);

  const digitoInformado =
    digitos.pop();

  let soma = 0;

  /*
    Calcula da direita para a esquerda.
    Pesos 3 e 1 alternados.
  */
  for (
    let i = digitos.length - 1,
        posicao = 0;
    i >= 0;
    i--,
        posicao++
  ) {
    soma +=
      digitos[i] *
      (
        posicao % 2 === 0
          ? 3
          : 1
      );
  }

  const digitoCalculado =
    (10 - (soma % 10)) % 10;

  return (
    digitoCalculado ===
    digitoInformado
  );
}

function converterQuantidadeMobile(valor) {
  let texto = String(valor ?? '')
    .trim()
    .replace(/\s/g, '')
    .replace(/[^\d,.\-]/g, '');

  if (!texto) {
    return 0;
  }

  const possuiVirgula =
    texto.includes(',');

  const possuiPonto =
    texto.includes('.');

  /*
    Aceita:

    16,088    -> 16.088
    16.088    -> 16.088
    16        -> 16
    1.234,567 -> 1234.567
    1,234.567 -> 1234.567
  */
  if (
    possuiVirgula &&
    possuiPonto
  ) {
    const ultimaVirgula =
      texto.lastIndexOf(',');

    const ultimoPonto =
      texto.lastIndexOf('.');

    if (
      ultimaVirgula >
      ultimoPonto
    ) {
      /*
        Padrão brasileiro.
        1.234,567
      */
      texto = texto
        .replace(/\./g, '')
        .replace(',', '.');
    } else {
      /*
        Padrão internacional.
        1,234.567
      */
      texto = texto.replace(/,/g, '');
    }
  } else if (possuiVirgula) {
    /*
      16,088 -> 16.088
    */
    texto = texto.replace(',', '.');
  }

  const numero =
    Number(texto);

  return Number.isFinite(numero)
    ? numero
    : 0;
}
function formatarQuantidadeMobile(
  valor,
  casas = 3
) {
  const numero =
    Number(valor) || 0;

  if (Number.isInteger(numero)) {
    return numero.toLocaleString(
      'pt-BR'
    );
  }

  return numero.toLocaleString(
    'pt-BR',
    {
      minimumFractionDigits: casas,
      maximumFractionDigits: casas,
    }
  );
}

        */
        for (

          const escopo =
            new URL(

          if (
            escopo === '/' ||
            escopo === ''
          ) {
            await registro.unregister();
          }
        }

        const registro =
          await navigator
            .serviceWorker
            .register(
              '/service-worker.js?v=10',
              {
                scope:
                  '/coleta-mobile',
              }
            );

        console.log(
          'Service Worker mobile registrado:',
          registro.scope
        );

        console.error(

  );
